<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <a class="btn" href="../../index.html" name="menu" class="removeSubli"> &#9776; Menu</a>
    <audio id="sound" src="/backend/midia/joo.mp3" display="display: none;"></audio>

    <div class="container">
        <h2>Minutos:</h2>
        <select id="minutos" name="minutos"></select>

        <h2>Segundos:</h2>
        <select id="segundos" name="segundos"></select>
        <br>
        <br>
        <button id="comecar">Começar</button>
        <div id="display">
            <h3></h3>
        </div> <!--display-->

    </div> <!--container-->

    <script>
        var display = document.getElementById("display");

        var minutos = document.getElementById("minutos");
        var segundos = document.getElementById("segundos");

        var comecar = document.getElementById("comecar");

        var cronometroSeg;

        var minutoAtual;
        var segundoAtual;

        var interval;

        for (var i = 0; i < 59; i++) {
            minutos.innerHTML += `<option value="${i}  ">${i}</option>`;
        }

        for (var i = 0; i < 59; i++) {
            segundos.innerHTML += `<option value="${i}  ">${i}</option>`;
        }

        comecar.addEventListener("click", function () {
            minutoAtual = minutos.value;
            segundoAtual = segundos.value;

            display.childNodes[1].innerHTML = `${minutoAtual} : ${segundoAtual}`;

            interval = setInterval(function () {
                segundoAtual--;
                if (segundoAtual <= 0) {
                    if (minutoAtual > 0) {
                        minutoAtual--;
                        segundoAtual = 59;
                    } else {
                        document.getElementById("sound").play();
                        alert("Desligar o alarme!");
                        clearInterval(interval);
                        location.reload();
                        
                    }

                }

                display.childNodes[1].innerHTML = `${minutoAtual} : ${segundoAtual}`;
            }, 1000);
        }
    );

    </script>
</body>

</html>
